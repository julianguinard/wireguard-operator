# Example: Client connecting to multiple WireGuard servers
# This demonstrates how a single client can connect to multiple WireGuard instances

# Scenario: A client machine needs to connect to:
# 1. Production VPN (vpn-prod)
# 2. Development VPN (vpn-dev)
# 3. Staging VPN (vpn-staging)

# Step 1: Create multiple Wireguard instances
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: Wireguard
metadata:
  name: vpn-prod
  namespace: default
spec:
  mtu: "1380"
  dns: "8.8.8.8"
  peerCIDR: "10.8.0.0/24"
---
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: Wireguard
metadata:
  name: vpn-dev
  namespace: default
spec:
  mtu: "1380"
  dns: "10.0.0.10"
  peerCIDR: "10.9.0.0/24"
---
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: Wireguard
metadata:
  name: vpn-staging
  namespace: default
spec:
  mtu: "1380"
  dns: "10.1.0.10"
  peerCIDR: "10.10.0.0/24"
---
# Step 2: Create peer resources for the same client in each Wireguard instance
# The client's public key is: xYz123ABC... (example)
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: WireguardPeer
metadata:
  name: client-multi-prod
  namespace: default
spec:
  wireguardRef: "vpn-prod"
  # Optional: Restrict access to specific networks
  allowedIPs: "10.0.0.0/8"
---
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: WireguardPeer
metadata:
  name: client-multi-dev
  namespace: default
spec:
  wireguardRef: "vpn-dev"
  allowedIPs: "172.16.0.0/12"
---
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: WireguardPeer
metadata:
  name: client-multi-staging
  namespace: default
spec:
  wireguardRef: "vpn-staging"
  allowedIPs: "192.168.0.0/16"
---
# Step 3: Controller automatically creates secrets:
# - vpn-prod-peer-configs (contains key: xYz123ABC...-peer-config)
# - vpn-dev-peer-configs (contains key: xYz123ABC...-peer-config)
# - vpn-staging-peer-configs (contains key: xYz123ABC...-peer-config)
#
# Each secret contains a complete WireGuard config for that peer

# Step 4: Client-agent deployment (on client machine)
# The client-agent will:
# 1. Scan all *-peer-configs secrets in the namespace
# 2. Find configs matching the public key
# 3. Merge them into a single config with multiple [Peer] sections
# 4. Apply using syncconf for safe updates

apiVersion: v1
kind: ConfigMap
metadata:
  name: client-agent-multi-config
  namespace: default
data:
  # Example of what the merged config will look like:
  merged-example.conf: |
    [Interface]
    PrivateKey = <client-private-key>
    Address = 10.8.0.3, 10.9.0.3, 10.10.0.3
    DNS = 8.8.8.8, 10.0.0.10, 10.1.0.10
    MTU = 1380

    # Production peers
    [Peer]
    PublicKey = <prod-server-public-key>
    Endpoint = prod.example.com:51820
    AllowedIPs = 10.0.0.0/8

    # Development peers
    [Peer]
    PublicKey = <dev-server-public-key>
    Endpoint = dev.example.com:51820
    AllowedIPs = 172.16.0.0/12

    # Staging peers
    [Peer]
    PublicKey = <staging-server-public-key>
    Endpoint = staging.example.com:51820
    AllowedIPs = 192.168.0.0/16

# Step 5: Systemd service for multi-WireGuard client
# Save as /etc/systemd/system/client-agent.service
apiVersion: v1
kind: ConfigMap
metadata:
  name: client-agent-multi-service
  namespace: default
data:
  client-agent.service: |
    [Unit]
    Description=WireGuard Operator Client Agent (Multi-Server)
    After=network.target
    
    [Service]
    Type=simple
    ExecStart=/usr/local/bin/client-agent \\
      --public-key=xYz123ABC... \\
      --namespace=default \\
      --kubeconfig=/etc/wireguard/kubeconfig \\
      --wg-config-path=/etc/wireguard/wg0.conf \\
      --wg-iface=wg0 \\
      --v=2
    
    Restart=always
    RestartSec=10
    
    [Install]
    WantedBy=multi-user.target

# Step 6: Verification commands
apiVersion: v1
kind: ConfigMap
metadata:
  name: client-agent-verification
  namespace: default
data:
  verify.sh: |
    #!/bin/bash
    echo "=== WireGuard Interface Status ==="
    wg show wg0
    
    echo ""
    echo "=== IP Addresses ==="
    ip addr show wg0
    
    echo ""
    echo "=== Routing Table ==="
    ip route show
    
    echo ""
    echo "=== Test Connectivity ==="
    echo "Testing production network..."
    ping -c 3 10.0.0.1 || echo "Production: No response"
    
    echo "Testing development network..."
    ping -c 3 172.16.0.1 || echo "Development: No response"
    
    echo "Testing staging network..."
    ping -c 3 192.168.0.1 || echo "Staging: No response"
    
    echo ""
    echo "=== Client-Agent Logs ==="
    journalctl -u client-agent -n 50 --no-pager

# Notes:
# 1. The client-agent automatically discovers all peer configs
# 2. Configs are merged by Interface section (same private key = same interface)
# 3. syncconf ensures safe updates without dropping existing connections
# 4. Each WireGuard server sees the client as a separate peer
# 5. Client can access all networks simultaneously through wg0
