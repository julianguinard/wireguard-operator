# Test scenario: Client with multiple interface groups
# This demonstrates when multiple config files are created

# Scenario: A client machine has TWO different keypairs:
# 1. Production keypair (for prod/staging networks)
# 2. Development keypair (for dev/test networks)

# Step 1: Create Wireguard instances
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: Wireguard
metadata:
  name: vpn-prod
spec:
  mtu: "1380"
  peerCIDR: "10.8.0.0/24"
---
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: Wireguard
metadata:
  name: vpn-staging
spec:
  mtu: "1380"
  peerCIDR: "10.10.0.0/24"
---
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: Wireguard
metadata:
  name: vpn-dev
spec:
  mtu: "1380"
  peerCIDR: "10.9.0.0/24"
---
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: Wireguard
metadata:
  name: vpn-test
spec:
  mtu: "1380"
  peerCIDR: "10.11.0.0/24"
---
# Step 2: Create peers with TWO different public keys
# Production key: PROD_PUBLIC_KEY
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: WireguardPeer
metadata:
  name: client-prod
spec:
  wireguardRef: "vpn-prod"
  publicKey: "PROD_PUBLIC_KEY"
---
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: WireguardPeer
metadata:
  name: client-staging
spec:
  wireguardRef: "vpn-staging"
  publicKey: "PROD_PUBLIC_KEY"
---
# Development key: DEV_PUBLIC_KEY
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: WireguardPeer
metadata:
  name: client-dev
spec:
  wireguardRef: "vpn-dev"
  publicKey: "DEV_PUBLIC_KEY"
---
apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: WireguardPeer
metadata:
  name: client-test
spec:
  wireguardRef: "vpn-test"
  publicKey: "DEV_PUBLIC_KEY"
---
# Step 3: Controller creates secrets
# vpn-prod-peer-configs contains: PROD_PUBLIC_KEY-peer-config
# vpn-staging-peer-configs contains: PROD_PUBLIC_KEY-peer-config
# vpn-dev-peer-configs contains: DEV_PUBLIC_KEY-peer-config
# vpn-test-peer-configs contains: DEV_PUBLIC_KEY-peer-config

# Step 4: Client-agent behavior
# When run with --public-key that matches PROD_PUBLIC_KEY:
# - Finds 2 configs (prod, staging)
# - Both have same PrivateKey in [Interface]
# - Groups them together
# - Creates: /etc/wireguard/wg0.conf
# - Applies: wg syncconf wg0 /etc/wireguard/wg0.conf
#
# When run with --public-key that matches DEV_PUBLIC_KEY:
# - Finds 2 configs (dev, test)
# - Both have same PrivateKey in [Interface] (different from prod)
# - Groups them together
# - Creates: /etc/wireguard/wg0.conf
# - Applies: wg syncconf wg0 /etc/wireguard/wg0.conf

# Step 5: Running TWO client-agent instances on same machine
# Instance 1 (Production):
#   --public-key=PROD_PUBLIC_KEY \
#   --wg-config-path=/etc/wireguard/wg0-prod.conf \
#   --wg-iface=wg0
#
# Instance 2 (Development):
#   --public-key=DEV_PUBLIC_KEY \
#   --wg-config-path=/etc/wireguard/wg0-dev.conf \
#   --wg-iface=wg1

# Result: Two separate WireGuard interfaces
# wg0: Connected to prod and staging (10.8.0.x, 10.10.0.x)
# wg1: Connected to dev and test (10.9.0.x, 10.11.0.x)

# Verification:
# wg show wg0  # Shows prod and staging peers
# wg show wg1  # Shows dev and test peers
# ip addr show wg0
# ip addr show wg1
